<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RimLink Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: transparent;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'JetBrains Mono', monospace;
    position: relative;
}

/* ══════════════════════════════════════════
   ОБЩИЕ СТИЛИ КАРТОЧЕК
══════════════════════════════════════════ */
.notification {
    position: absolute;
    bottom: 40px;
    right: 40px;
    width: 480px;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: flex-end;
}

.card {
    width: 100%;
    border-radius: 16px;
    padding: 20px 24px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(12px);
    transform: translateX(540px);
    opacity: 0;
    transition: none;
}

.card.show {
    animation: slideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

.card.hide {
    animation: slideOut 0.4s cubic-bezier(0.55, 0, 1, 0.45) forwards;
}

@keyframes slideIn {
    from { transform: translateX(540px); opacity: 0; }
    to   { transform: translateX(0);     opacity: 1; }
}

@keyframes slideOut {
    from { transform: translateX(0);     opacity: 1; }
    to   { transform: translateX(540px); opacity: 0; }
}

/* прогресс-бар внизу карточки — сколько осталось показывать */
.card-timer {
    position: absolute;
    bottom: 0; left: 0;
    height: 3px;
    width: 100%;
    transform-origin: left;
}

.card-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 600;
    margin-bottom: 6px;
    opacity: 0.7;
}

.card-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 18px;
    font-weight: 900;
    line-height: 1.2;
    margin-bottom: 4px;
}

.card-sub {
    font-size: 12px;
    opacity: 0.75;
    line-height: 1.5;
}

.card-icon {
    font-size: 36px;
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    filter: drop-shadow(0 0 12px currentColor);
    opacity: 0.9;
}

/* ДЖЕКПОТ CSS-блок целиком удалён 2026-05-10 (Phase 1.I lexicon scrub) */

/* ══════════════════════════════════════════
   ИВЕНТ — СТАРТ (фиолетовый)
══════════════════════════════════════════ */
.card-event-start {
    background: linear-gradient(135deg, rgba(8,5,20,0.93) 0%, rgba(20,8,45,0.93) 100%);
    border: 1px solid rgba(140, 80, 255, 0.5);
    box-shadow:
        0 0 0 1px rgba(140,80,255,0.1),
        0 8px 40px rgba(100,40,200,0.35),
        inset 0 1px 0 rgba(180,120,255,0.15);
}
.card-event-start .card-label { color: #b06aff; }
.card-event-start .card-title { color: #f0e8ff; }
.card-event-start .card-sub   { color: #c8a8ff; }
.card-event-start .card-timer { background: linear-gradient(90deg, #9747ff, #e040fb); }

/* анимированная рамка */
.card-event-start::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 17px;
    background: linear-gradient(90deg, #9747ff, #e040fb, #9747ff);
    background-size: 200%;
    animation: borderFlow 2s linear infinite;
    z-index: -1;
    opacity: 0.6;
}
@keyframes borderFlow {
    0%   { background-position: 0%; }
    100% { background-position: 200%; }
}

/* ══════════════════════════════════════════
   ИВЕНТ — ТАЙМЕР (идёт ивент)
══════════════════════════════════════════ */
.card-event-live {
    background: linear-gradient(135deg, rgba(5,15,20,0.93) 0%, rgba(5,25,35,0.93) 100%);
    border: 1px solid rgba(0,200,160,0.4);
    box-shadow:
        0 0 0 1px rgba(0,200,160,0.1),
        0 8px 40px rgba(0,160,130,0.25),
        inset 0 1px 0 rgba(0,255,200,0.1);
}
.card-event-live .card-label { color: #00e8b8; }
.card-event-live .card-title { color: #e0fff8; }
.card-event-live .card-sub   { color: #80f0d8; }
.card-event-live .card-timer { background: linear-gradient(90deg, #00e8b8, #00b8ff); }
.card-event-live .card-icon  { color: #00e8b8; }

/* пульс онлайн-точка */
.live-dot {
    display: inline-block;
    width: 8px; height: 8px;
    background: #00e8b8;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    box-shadow: 0 0 0 0 rgba(0,232,184,0.5);
    animation: livePulse 1.5s ease-out infinite;
}
@keyframes livePulse {
    0%   { box-shadow: 0 0 0 0   rgba(0,232,184,0.5); }
    70%  { box-shadow: 0 0 0 8px rgba(0,232,184,0); }
    100% { box-shadow: 0 0 0 0   rgba(0,232,184,0); }
}

/* вклады голосующих */
.bids-list {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.bid-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
}
.bid-bar-wrap {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
}
.bid-bar {
    height: 100%;
    background: linear-gradient(90deg, #00e8b8, #00b8ff);
    border-radius: 2px;
    transition: width 0.5s ease;
}
.bid-name { color: #e0fff8; min-width: 80px; }
.bid-amount { color: #80f0d8; min-width: 60px; text-align: right; }
.bid-chance { color: #00e8b8; min-width: 40px; text-align: right; }

/* ══════════════════════════════════════════
   ИВЕНТ — ФИНАЛ (победитель)
══════════════════════════════════════════ */
.card-event-end {
    background: linear-gradient(135deg, rgba(5,15,5,0.93) 0%, rgba(10,30,10,0.93) 100%);
    border: 1px solid rgba(50,200,100,0.45);
    box-shadow:
        0 0 0 1px rgba(50,200,100,0.1),
        0 8px 40px rgba(30,160,70,0.3),
        inset 0 1px 0 rgba(80,255,120,0.12);
}
.card-event-end .card-label { color: #50e880; }
.card-event-end .card-title { color: #e8ffe0; }
.card-event-end .card-sub   { color: #90e8a8; }
.card-event-end .card-timer { background: linear-gradient(90deg, #50e880, #00ff88); }

.winner-name {
    font-family: 'Unbounded', sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: #50e880;
    text-shadow: 0 0 20px rgba(80,232,128,0.5);
}
.prize-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(80,232,128,0.12);
    border: 1px solid rgba(80,232,128,0.3);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 12px;
    color: #50e880;
    margin-top: 6px;
}

/* конфетти на победу */
.confetti-wrap {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: 16px;
    pointer-events: none;
}
.confetti-piece {
    position: absolute;
    width: 6px;
    height: 10px;
    border-radius: 2px;
    top: -10px;
    animation: confettiFall var(--d, 1.2s) var(--delay, 0s) ease-in forwards;
    left: var(--x, 50%);
    background: var(--c, #50e880);
    transform: rotate(var(--r, 0deg));
}
@keyframes confettiFall {
    0%   { transform: rotate(var(--r)) translateY(0)   scaleX(1); opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: rotate(calc(var(--r) + 360deg)) translateY(120px) scaleX(0.5); opacity: 0; }
}

/* ДОНАТ CSS-блок удалён 2026-05-14 (Phase 8.F donate removal —
   §5.2/§5.4 compliance, real-money flow вне Bits недопустим) */

/* ══════════════════════════════════════════
   ДРОП — янтарно-оранжевый
══════════════════════════════════════════ */
.card-drop {
    background: linear-gradient(135deg, rgba(18,10,0,0.93) 0%, rgba(35,18,0,0.93) 100%);
    border: 1px solid rgba(255,160,40,0.45);
    box-shadow:
        0 0 0 1px rgba(255,160,40,0.12),
        0 8px 40px rgba(200,100,0,0.28),
        inset 0 1px 0 rgba(255,200,80,0.14);
}
.card-drop .card-label { color: #ffaa30; }
.card-drop .card-title { color: #fff4e0; }
.card-drop .card-sub   { color: #ffd080; }
.card-drop .card-timer { background: linear-gradient(90deg, #ffaa30, #ff6600); }
.card-drop .card-icon  { color: #ffaa30; }

.drop-item {
    font-family: 'Unbounded', sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: #ffaa30;
    text-shadow: 0 0 18px rgba(255,170,48,0.55);
    margin: 3px 0;
}

.drop-rarity {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border-radius: 8px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 600;
    margin-top: 5px;
    letter-spacing: 1px;
    text-transform: uppercase;
}
.drop-rarity.common   { background: rgba(180,180,180,0.12); border: 1px solid rgba(180,180,180,0.3); color: #d0d0d0; }
.drop-rarity.uncommon { background: rgba(80,200,80,0.12);   border: 1px solid rgba(80,200,80,0.35);  color: #60e060; }
.drop-rarity.rare     { background: rgba(80,140,255,0.12);  border: 1px solid rgba(80,140,255,0.35); color: #80aaff; }
.drop-rarity.epic     { background: rgba(180,60,255,0.14);  border: 1px solid rgba(180,60,255,0.4);  color: #cc80ff; }


/* MEGA JACKPOT CSS блок целиком удалён 2026-05-10 (Phase 1.I lexicon scrub) */

/* ══════════════════════════════════════
   ПОСТОЯННАЯ ПАНЕЛЬ ИВЕНТА (справа)
══════════════════════════════════════ */
#event-panel {
    position: absolute;
    top: 50%;
    right: 0;
    transform: translateY(-50%) translateX(100%);
    width: 320px;
    pointer-events: none;
    transition: transform 0.6s cubic-bezier(0.34, 1.2, 0.64, 1),
                opacity   0.6s ease;
    opacity: 0;
}

#event-panel.visible {
    transform: translateY(-50%) translateX(0);
    opacity: 1;
}

.ep-wrap {
    background: linear-gradient(160deg,
        rgba(8, 5, 22, 0.94) 0%,
        rgba(16, 6, 40, 0.94) 100%
    );
    border: 1px solid rgba(130, 60, 255, 0.35);
    border-right: none;
    border-radius: 20px 0 0 20px;
    padding: 18px 20px 16px;
    position: relative;
    overflow: hidden;
    box-shadow:
        -8px 0 40px rgba(100, 30, 200, 0.25),
        inset 1px 0 0 rgba(160, 100, 255, 0.12);
}

/* фоновое свечение */
.ep-wrap::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(130,60,255,0.18) 0%, transparent 70%);
    pointer-events: none;
}

/* анимированная левая полоска */
.ep-accent {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, #9747ff, #e040fb, #00e8b8);
    background-size: 100% 200%;
    animation: accentFlow 3s linear infinite;
    border-radius: 0 2px 2px 0;
}
@keyframes accentFlow {
    0%   { background-position: 0% 0%; }
    100% { background-position: 0% 200%; }
}

/* шапка */
.ep-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.ep-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(130,60,255,0.18);
    border: 1px solid rgba(130,60,255,0.3);
    border-radius: 20px;
    padding: 3px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    color: #c090ff;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.ep-live-dot {
    width: 6px; height: 6px;
    background: #e040fb;
    border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(224,64,251,0.4);
    animation: livePing 1.5s ease-out infinite;
}
@keyframes livePing {
    0%   { box-shadow: 0 0 0 0   rgba(224,64,251,0.4); }
    70%  { box-shadow: 0 0 0 8px rgba(224,64,251,0);   }
    100% { box-shadow: 0 0 0 0   rgba(224,64,251,0);   }
}

/* тип ивента */
.ep-type {
    font-family: 'Unbounded', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: #a060ff;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
}

/* приз */
.ep-prize {
    font-family: 'Unbounded', sans-serif;
    font-size: 18px;
    font-weight: 900;
    color: #ffd700;
    text-shadow: 0 0 20px rgba(255,215,0,0.35);
    line-height: 1.2;
    margin-bottom: 14px;
    padding-right: 8px;
}

/* таймер */
.ep-timer-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 12px;
}

.ep-timer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    font-weight: 700;
    color: #ff4da6;
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    text-shadow: 0 0 20px rgba(255,77,166,0.4);
}

.ep-timer.warning { color: #ff6020; text-shadow: 0 0 20px rgba(255,96,32,0.5); }

.ep-timer-label {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.5px;
}

/* прогресс-бар таймера */
.ep-timer-bar {
    height: 2px;
    background: rgba(255,255,255,0.08);
    border-radius: 1px;
    overflow: hidden;
    margin-bottom: 14px;
}
.ep-timer-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff4da6, #9747ff);
    border-radius: 1px;
    transition: width 1s linear;
}

/* разделитель */
.ep-divider {
    height: 1px;
    background: rgba(255,255,255,0.06);
    margin-bottom: 10px;
}

/* участники */
.ep-stats-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 10px;
    font-family: 'JetBrains Mono', monospace;
}
.ep-stats-row b { color: rgba(255,255,255,0.75); }

/* вклады голосующих */
.ep-bids {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.ep-bid {
    display: flex;
    align-items: center;
    gap: 7px;
    position: relative;
}

/* фоновый бар-заливка строки */
.ep-bid-bg {
    position: absolute;
    inset: 0;
    border-radius: 6px;
    background: rgba(130,60,255,0.08);
    transform-origin: left;
    transition: transform 0.6s ease;
}

.ep-bid-rank {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    width: 14px;
    text-align: center;
    flex-shrink: 0;
    position: relative;
}

.ep-bid-name {
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    position: relative;
    padding: 3px 0;
}

.ep-bid-bar-wrap {
    width: 50px;
    height: 3px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
}
.ep-bid-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #9747ff, #e040fb);
    border-radius: 2px;
    transition: width 0.6s ease;
}

.ep-bid-pct {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #c090ff;
    width: 34px;
    text-align: right;
    flex-shrink: 0;
    position: relative;
}

/* анонс ивента — появляется поверх панели при старте */
#ep-announce {
    position: absolute;
    top: -64px;
    left: 0; right: 0;
    background: linear-gradient(135deg,
        rgba(130,60,255,0.9) 0%,
        rgba(224,64,251,0.9) 100%
    );
    border-radius: 14px 0 0 14px;
    padding: 12px 16px;
    text-align: center;
    font-family: 'Unbounded', sans-serif;
    font-size: 13px;
    font-weight: 900;
    color: white;
    letter-spacing: 0.5px;
    transform: translateY(-20px);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.34,1.2,0.64,1);
    border-right: none;
    box-shadow: -4px 4px 20px rgba(130,60,255,0.4);
}
#ep-announce.show {
    transform: translateY(0);
    opacity: 1;
}

/* ══════════════════════════════════════
   PETS-STRIP — активные зрители с питомцами
   (Phase 7, 2026-05-12; opt-out streamer'ом)
══════════════════════════════════════ */
#pets-strip {
    position: absolute;
    bottom: 40px;
    left: 40px;
    display: flex;
    gap: 12px;
    max-width: 900px;
    flex-wrap: nowrap;
    overflow: hidden;
    pointer-events: none;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity .4s ease, transform .4s ease;
}
#pets-strip.visible {
    opacity: 1;
    transform: translateY(0);
}
.pet-card {
    background: rgba(15, 10, 30, 0.78);
    border: 1px solid rgba(145, 71, 255, 0.35);
    border-radius: 14px;
    padding: 10px 12px;
    min-width: 88px;
    text-align: center;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
    /* slide-in появление; каждой карточке через JS даём transitionDelay */
    opacity: 0;
    transform: translateY(16px);
    transition: opacity .35s ease, transform .35s cubic-bezier(0.34, 1.4, 0.64, 1);
}
.pet-card.in {
    opacity: 1;
    transform: translateY(0);
}
.pet-card.with-bg {
    /* фон-косметика тонкое pulsing-свечение */
    animation: pet-bg-pulse 4s ease-in-out infinite;
}
@keyframes pet-bg-pulse {
    0%, 100% { box-shadow: 0 4px 20px rgba(0,0,0,.4), 0 0 0 0 rgba(145,71,255,0); }
    50%      { box-shadow: 0 4px 20px rgba(0,0,0,.4), 0 0 22px 2px rgba(145,71,255,.18); }
}
.pet-card.with-bg {
    background: linear-gradient(135deg, rgba(145,71,255,.22), rgba(8,5,22,.85));
    border-color: rgba(145, 71, 255, 0.6);
}
.pet-card-visual {
    line-height: 1.1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 4px;
}
.pet-card-visual .pc-head, .pet-card-visual .pc-acc {
    font-size: 18px;
}
.pet-card-visual .pc-head { transform: translateY(-4px); }

/* ===== PET-STAGE (Sprint 5.21) — inline копия для standalone overlay.html =====
   Зеркало стилей из viewer.css. SVG creature + 6 anchored slots. */
.pet-stage {
    position: relative;
    width: var(--pet-stage-size, 64px);
    aspect-ratio: 1;
    margin: 0 auto;
    border-radius: 14px;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 60%, rgba(168,85,247,.18), transparent 70%);
}
.pet-stage__bg {
    position: absolute; inset: 0; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--pet-stage-size, 64px) * 1.1);
    line-height: 1; opacity: 0.22; filter: blur(2px);
    pointer-events: none;
}
.pet-stage__aura {
    position: absolute; inset: -8%; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--pet-stage-size, 64px) * 1.05);
    opacity: 0.7;
    animation: pet-stage-aura 2.4s ease-in-out infinite;
    pointer-events: none;
}
@keyframes pet-stage-aura {
    0%, 100% { transform: scale(0.95); opacity: 0.5; }
    50%      { transform: scale(1.05); opacity: 0.85; }
}
.pet-stage__base {
    position: absolute; inset: 0; z-index: 3;
    width: 100%; height: 100%;
    pointer-events: none;
    animation: pet-stage-breathe 4s ease-in-out infinite;
}
.pet-stage__creature { width: 100%; height: 100%; display: block; }
@keyframes pet-stage-breathe {
    0%, 100% { transform: translateY(0)    scale(1); }
    50%      { transform: translateY(-1px) scale(1.015); }
}
.pet-stage__egg {
    position: absolute; inset: 0; z-index: 3;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--pet-stage-size, 64px) * 0.55);
    line-height: 1;
    animation: pet-stage-wobble 3.2s ease-in-out infinite;
    pointer-events: none;
}
@keyframes pet-stage-wobble {
    0%, 100% { transform: rotate(-3deg); }
    50%      { transform: rotate( 3deg); }
}

<script>
const SERVER = 'https://shedoy23.ru';
const POLL_INTERVAL = 2000;  // опрос каждые 2 сек

// ══════════════════════════════════════════
// ОЧЕРЕДЬ УВЕДОМЛЕНИЙ
// ══════════════════════════════════════════
let notifQueue = [];
let isShowing = false;
let currentCard = null;
let currentTimer = null;

function queueNotif(config) {
    notifQueue.push(config);
    if (!isShowing) processQueue();
}

function processQueue() {
    if (notifQueue.length === 0) { isShowing = false; return; }
    isShowing = true;
    showCard(notifQueue.shift());
}

function showCard(config) {
    const stack = document.getElementById('notif-stack');

    // Создаём карточку
    const card = document.createElement('div');
    card.className = `card card-${config.type}`;
    card.innerHTML = buildCardHTML(config);
    stack.appendChild(card);
    currentCard = card;

    // Trigger animation
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            card.classList.add('show');
        });
    });

    // Анимируем timer-bar
    const timerBar = card.querySelector('.card-timer');
    const duration = config.duration || 6000;
    if (timerBar) {
        timerBar.style.transition = `transform ${duration}ms linear`;
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                timerBar.style.transform = 'scaleX(0)';
            });
        });
    }

    // Убираем через duration
    currentTimer = setTimeout(() => {
        card.classList.remove('show');
        card.classList.add('hide');
        setTimeout(() => {
            card.remove();
            processQueue();
        }, 450);
    }, duration);
}

function buildCardHTML(cfg) {
    switch (cfg.type) {
        // 'jackpot' card type удалён 2026-05-10 (Phase 1.I lexicon scrub)

        case 'event-live':
            return buildEventLiveCard(cfg);
        case 'event-end':
            return buildEventEndCard(cfg);
        // 'donate' case удалён 2026-05-14 (Phase 8.F donate removal)
        case 'drop':
            return buildDropCard(cfg);
        default:
            return '';
    }
}

function buildEventStartCard(cfg) {

        <div class="card-icon">⚖️</div>

}

function buildEventLiveCard(cfg) {
    const bidsHTML = (cfg.bids || []).slice(0, 5).map((b, i) => `
        <div class="bid-row">
            <span class="bid-name">${i + 1}. ${esc(b.username)}</span>

            <span class="bid-amount">${formatNum(b.amount)}💎</span>

    `).join('');

    return `
        <div class="card-label"><span class="live-dot"></span>ИВЕНТ ИДЁТ</div>
        <div class="card-title">${esc(cfg.type_name)} — 🏆 ${esc(cfg.prize_name)}</div>
        <div class="card-sub">Осталось: <b>${cfg.time_left_fmt}</b> · ${cfg.participants} участников · ${formatNum(cfg.total_pool)}💎</div>
        ${bidsHTML ? `<div class="bids-list">${bidsHTML}</div>` : ''}
        <div class="card-timer"></div>
    `;
}

function buildEventEndCard(cfg) {
    const confetti = Array.from({length: 16}, (_, i) => {
        const colors = ['#50e880','#00ff88','#ffd700','#ff6eb4','#60a5fa'];
        const c = colors[i % colors.length];
        const x = Math.random() * 100;
        const d = 0.6 + Math.random() * 0.8;
        const delay = Math.random() * 0.5;
        const r = Math.random() * 360;
        return `<div class="confetti-piece" style="--x:${x}%;--d:${d}s;--delay:${delay}s;--c:${c};--r:${r}deg"></div>`;
    }).join('');

    return `
        <div class="confetti-wrap">${confetti}</div>
        <div class="card-label">🏆 ПОБЕДИТЕЛЬ</div>
        <div class="winner-name">${esc(cfg.winner)}</div>

}

function buildDropCard(cfg) {

function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatNum(n) {
    return Number(n).toLocaleString('ru-RU');
}

// ПОЛЛИНГ СЕРВЕРА

// ══════════════════════════════════════
let epTimerInterval = null;
let epTotalSeconds  = 0;
let epStartSeconds  = 0;

function showEventPanel(ae) {
    const panel = document.getElementById('event-panel');
    panel.classList.add('visible');

    document.getElementById('ep-type-name').textContent   = ae.type_name || '⚖️ Аукцион';
    document.getElementById('ep-prize').textContent       = '🏆 ' + (ae.prize?.name || '?');
    document.getElementById('ep-badge-text').textContent  = 'АУКЦИОН';
    document.getElementById('ep-participants').textContent = ae.participants + ' участников';
    document.getElementById('ep-pool').textContent        = formatNum(ae.total_pool || 0);

    updateEpBids(ae.bids || []);
    startEpTimer(ae.time_left, ae.time_left);
}

function updateEventPanel(ae) {
    if (!ae) return;
    document.getElementById('ep-participants').textContent = ae.participants + ' участников';
    document.getElementById('ep-pool').textContent        = formatNum(ae.total_pool || 0);
    updateEpBids(ae.bids || []);
    // таймер обновляется сам, только корректируем если сильно расошлось
    const remaining = parseInt(document.getElementById('ep-timer').dataset.remaining || 0);
    if (Math.abs(remaining - ae.time_left) > 5) {
        startEpTimer(ae.time_left, epStartSeconds || ae.time_left);
    }
}

function hideEventPanel(showWinner) {
    const panel = document.getElementById('event-panel');
    panel.classList.remove('visible');
    stopEpTimer();
}

function announceEvent(typeName, prizeName) {
    const el = document.getElementById('ep-announce');
    el.textContent = '✨ ' + typeName + ' — ' + prizeName;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 4000);
}

function updateEpBids(bids) {
    const el = document.getElementById('ep-bids');
    if (!bids.length) {
        el.innerHTML = '<div style="font-size:11px;color:rgba(255,255,255,0.25);text-align:center;padding:4px 0;">Ставок пока нет</div>';
        return;
    }
    el.innerHTML = bids.slice(0, 6).map((b, i) => {
        const medals = ['🥇','🥈','🥉'];
        const rank = medals[i] || (i + 1) + '.';
        return `
        <div class="ep-bid">
            <div class="ep-bid-bg" style="transform:scaleX(${b.chance / 100})"></div>
            <div class="ep-bid-rank">${rank}</div>
            <div class="ep-bid-name">${esc(b.username)}</div>
            <div class="ep-bid-bar-wrap"><div class="ep-bid-bar-fill" style="width:${b.chance}%"></div></div>
            <div class="ep-bid-pct">${b.chance}%</div>
        </div>`;
    }).join('');
}

function startEpTimer(seconds, totalSeconds) {
    stopEpTimer();
    epTotalSeconds = totalSeconds || seconds;
    epStartSeconds = totalSeconds || seconds;
    let s = seconds;
    const timerEl = document.getElementById('ep-timer');
    const fillEl  = document.getElementById('ep-timer-fill');
    timerEl.dataset.remaining = s;

    function tick() {
        timerEl.textContent = fmtEpTime(Math.max(0, s));
        timerEl.dataset.remaining = s;
        const pct = Math.max(0, (s / epStartSeconds) * 100);
        fillEl.style.width = pct + '%';
        // красный когда меньше 60 сек
        if (s <= 60) {
            timerEl.classList.add('warning');
            fillEl.style.background = 'linear-gradient(90deg, #ff6020, #ff2060)';
        } else {
            timerEl.classList.remove('warning');
            fillEl.style.background = 'linear-gradient(90deg, #ff4da6, #9747ff)';
        }
        if (s <= 0) { stopEpTimer(); return; }
        s--;
    }
    tick();
    epTimerInterval = setInterval(tick, 1000);
}

function stopEpTimer() {
    if (epTimerInterval) { clearInterval(epTimerInterval); epTimerInterval = null; }
}

function fmtEpTime(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
}

let lastEventId = null;
let lastEventState = null; // 'none' | 'active' | 'ended'
let lastWinnerId = null;
// lastDonateTs удалён 2026-05-14 (Phase 8.F donate removal)
let lastDropId = null;
let seenLiveEventBuckets = new Set();  // ranamed from seenJackpots 2026-05-10 (Phase 1.I)

async function poll() {
    try {
        // 1. Событие рулекциона
        const ev = await fetch(SERVER + '/api/event/status').then(r => r.json());

        if (ev.active_event) {
            const ae = ev.active_event;

            if (lastEventId !== ae.id) {
                // Новый ивент — анонс + показываем панель
                lastEventId = ae.id;
                lastEventState = 'active';
                // Уведомление в углу
                queueNotif({
                    type: 'event-start',
                    type_name: ae.type_name,
                    prize_name: ae.prize?.name || '?',
                    type_desc: ae.type_desc,
                    event_type: ae.type,
                    duration: 7000
                });
                // Показываем постоянную панель
                showEventPanel(ae);
                announceEvent(ae.type_name, ae.prize?.name || '?');
            } else {
                // Ивент идёт — обновляем панель
                updateEventPanel(ae);
            }

            // live-карточка в углу раз в 45 сек с текущими вкладами
            if (ae.participants > 0) {
                const liveKey = `live-${ae.id}-${Math.floor(ae.time_left / 45)}`;
                if (!seenLiveEventBuckets.has(liveKey)) {
                    seenLiveEventBuckets.add(liveKey);
                    queueNotif({
                        type: 'event-live',
                        type_name: ae.type_name,
                        prize_name: ae.prize?.name || '?',
                        time_left_fmt: ae.time_left_fmt,
                        participants: ae.participants,
                        total_pool: ae.total_pool,
                        bids: ae.bids || [],
                        duration: 10000
                    });
                }
            }

        } else if (lastEventState === 'active') {
            // Ивент закончился — скрываем панель
            lastEventState = 'ended';
            hideEventPanel();
        }

        // Победитель
        if (ev.last_winner && ev.last_winner.has_winner) {
            const wid = ev.last_winner.ended_at;
            if (wid !== lastWinnerId) {
                lastWinnerId = wid;
                lastEventState = 'none';
                lastEventId = null;

                queueNotif({
                    type: 'event-end',
                    winner: ev.last_winner.winner,
                    prize_name: ev.last_winner.prize?.name || '?',
                    message: ev.last_winner.message || '',
                    duration: 9000
                });

                fetch(SERVER + '/api/event/ack-winner', { method: 'POST' }).catch(() => {});
            }
        }

    } catch(e) {}

    try {
        // 2. Drop notifications через /api/overlay/latest
        // jackpot-handler удалён 2026-05-10 (Phase 1.I — casino вырезано)
        // donate-handler удалён 2026-05-14 (Phase 8.F donate removal)
        const jp = await fetch(SERVER + '/api/overlay/latest').then(r => r.json());

        if (jp.drop && jp.drop.id !== lastDropId) {
            lastDropId = jp.drop.id;
            queueNotif({
                type: 'drop',
                username: jp.drop.username,
                item_name: jp.drop.item_name,
                rarity: jp.drop.rarity || 'common',
                duration: 6000
            });
        }

    } catch(e) {}
}

let _lastPetsSnapshot = '';

async function pollPets() {
    try {
        const url = SERVER + '/api/overlay/pets'
            + (PETS_CHANNEL_ID > 0 ? `?channel_id=${PETS_CHANNEL_ID}` : '');
        const r = await fetch(url);
        const data = await r.json();
        const strip = document.getElementById('pets-strip');

        if (!data.success || !data.enabled || !data.viewers || data.viewers.length === 0) {
            strip.classList.remove('visible');
            strip.innerHTML = '';
            _lastPetsSnapshot = '';

        }

        // Snapshot key: сортированный список (username|head|acc|bg|name)
        const snapshot = data.viewers.map(v => {
            const eq = v.equipped || {};
            return [
                v.username || '?',
                eq.head?.item_id || '',
                eq.accessory?.item_id || '',
                eq.background?.item_id || '',
                v.name || '',
                v.pet_type || 'egg',
            ].join('|');
        }).sort().join(';');

        // Если контент не изменился — пропускаем перерисовку (нет flicker).
        if (snapshot === _lastPetsSnapshot) {
            strip.classList.add('visible');
            return;
        }
        _lastPetsSnapshot = snapshot;

        strip.innerHTML = data.viewers.map(v => {
            const eq = v.equipped || {};
            const bg = eq.background;
            const pet = {pet_type: v.pet_type, name: v.name};
            const displayName = v.name ? v.name : '@' + (v.username || '?');
            const username = v.username ? '@' + v.username : '';
            // Sprint 5.21: shared PetStage rendering — creature SVG + slot overlays.
            // Размер 64px для compact strip-card.
            const stageHtml = (typeof PetStage !== 'undefined')
                ? PetStage.renderHtml(pet, eq, {size: 64})
                : `<span>${v.pet_type === 'egg' ? '🥚' : '🐣'}</span>`;
            return `
                <div class="pet-card ${bg ? 'with-bg' : ''}">
                    <div class="pet-card-visual">${stageHtml}</div>
                    <div class="pet-card-name">${escapeHtmlOL(displayName)}</div>
                    ${v.name && username ? `<div class="pet-card-user">${escapeHtmlOL(username)}</div>` : ''}
                </div>
            `;
        }).join('');
        strip.classList.add('visible');

        // Stagger-анимация: каждой карточке +60ms delay, .in флаг
        const cards = strip.querySelectorAll('.pet-card');
        cards.forEach((card, i) => {
            card.style.transitionDelay = `${i * 60}ms`;
            // двойной rAF — ждём что CSS подцепил initial state
            requestAnimationFrame(() => {
                requestAnimationFrame(() => card.classList.add('in'));
            });
        });
    } catch (e) { /* silent */ }
}

function escapeHtmlOL(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[c]));
}

// ══════════════════════════════════════════
// СТАРТ
// ══════════════════════════════════════════
// ══════════════════════════════════════════
// BANNERLORD SUMMONED HEROES — Sprint 5.4 (BLT-style)
// Polls /api/overlay/bannerlord/summoned каждые 1с.
// Row-layout, HP bar = card background fill, side colors (blue/red),
// state glow (active/routed/unconscious/killed), compact numbers.
// ══════════════════════════════════════════
const BNR_POLL_INTERVAL = 1000;

// Compact number formatter ("1.2K" / "12M") — BLT pattern.
const _bnrCompact = new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 });
function bnrFmt(n) { return _bnrCompact.format(Math.round(n || 0)); }

// Sort: player side first → больше kills сверху → alpha.
function bnrSortParticipants(a, b) {
    if (a.is_player_side !== b.is_player_side) return a.is_player_side ? -1 : 1;
    if ((b.kills || 0) !== (a.kills || 0)) return (b.kills || 0) - (a.kills || 0);
    return (a.username || '').localeCompare(b.username || '');
}

async function pollBannerlordSummoned() {
    try {
        const url = SERVER + '/api/overlay/bannerlord/summoned'
            + (PETS_CHANNEL_ID > 0 ? `?channel_id=${PETS_CHANNEL_ID}` : '');
        const r = await fetch(url);
        const data = await r.json();
        const panel = document.getElementById('bnr-summoned-panel');
        if (!panel) return;

        const participants = (data.participants || []).slice().sort(bnrSortParticipants);
        if (!data.active || participants.length === 0) {
            panel.classList.remove('visible');
            panel.innerHTML = '';
            return;
        }

        panel.innerHTML = participants.map(p => {
            const username = escapeHtmlOL(p.username || '?');
            const hp = Math.max(0, p.hp || 0);
            const hpMax = Math.max(1, p.hp_max || 100);
            const pct = Math.max(0, Math.min(100, (hp / hpMax) * 100));
            const sideClass = p.is_player_side ? 'side-player' : 'side-enemy';
            const stateClass = `state-${p.state || (p.alive ? 'active' : 'killed')}`;
            const kills = p.kills || 0;
            const gold = bnrFmt(p.gold_earned);
            const xp = bnrFmt(p.xp_earned);
            const killsStr = kills > 0 ? `☠${kills}` : '';
            return `
                <div class="bnr-hero-card ${sideClass} ${stateClass}">
                    <div class="bnr-hp-fill" style="width: ${pct.toFixed(1)}%;"></div>
                    <div class="bnr-hero-name">${username}</div>
                    <div class="bnr-hero-stats">
                        <span class="stat-kills">${killsStr}</span>
                        <span class="stat-gold">+${gold}💰</span>
                        <span class="stat-xp">+${xp}XP</span>
                    </div>
                </div>
            `;
        }).join('');
        panel.classList.add('visible');
    } catch (e) { /* silent */ }
}

if (new URLSearchParams(location.search).get('preview') === '1') {
    runPreview();
} else {
    poll();
    setInterval(poll, POLL_INTERVAL);
    pollPets();
    setInterval(pollPets, PETS_POLL_INTERVAL);
    pollBannerlordSummoned();
    setInterval(pollBannerlordSummoned, BNR_POLL_INTERVAL);
}
</script>
