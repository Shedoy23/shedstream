# Копия /etc/nginx/sites-enabled/twitchbot (прод, снято 25.09.2026) + правки
# производительности. Применять ТОЛЬКО вне стрима: сначала бэкап и `nginx -t`,
# потом `systemctl reload nginx` (перезагрузка мягкая, соединения не рвёт).
#
# Правки 25.09 (сервер 1 ядро упёрся в процессор на ~50 запросах/с зрителей):
#  1) keepalive к приложению: раньше nginx открывал новое соединение к uvicorn
#     на КАЖДЫЙ запрос;
#  2) лог с временем ответа ($request_time, $upstream_response_time) — чтобы
#     найти самые тяжёлые запросы по цифрам, а не наугад.

log_format timed '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                 'rt=$request_time urt=$upstream_response_time';

upstream twitchbot_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen 443 ssl;
    server_name shedoy23.ru www.shedoy23.ru;

    # RimWorld catalogs can exceed nginx's default request body limit.
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/shedoy23.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shedoy23.ru/privkey.pem;

    access_log /var/log/nginx/access.log timed;

    # Immutable, signed Manager integration releases. HTTP is deliberately not
    # redirected: Manager starts with HTTPS and rejects every redirect.
    location ^~ /releases/ {
        if ($scheme != https) { return 404; }
        alias /srv/shedlink/releases/;
        autoindex off;
        limit_except GET HEAD { deny all; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://twitchbot_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /frontend/ {
        proxy_pass http://twitchbot_app/frontend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
