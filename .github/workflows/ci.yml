name: CI

# Cheap, fast safety net for a solo dev: compile-check, consistency lints,
# and the canonical backend suite are blocking gates.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Locate extension dir
        run: |
          for d in */; do [ -d "${d}backend" ] && echo "EXT=${d%/}" >> "$GITHUB_ENV" && break; done
          echo "Extension dir: $(grep EXT= "$GITHUB_ENV")"

      # ── Blocking gates (deterministic) ──────────────────────────────────
      - name: Python compile (backend)
        run: python -m compileall -q "$EXT/backend"

      - name: JS syntax check (frontend)
        run: |
          for f in "$EXT"/frontend/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      # pyflakes питает check_undefined_names (см. scripts/README.md). Без него
      # проверка мягко пропускается — в CI ставим явно, чтобы она реально шла.
      - name: Install lint deps
        run: pip install pyflakes

      - name: Consistency lints (version sync / migrations wired / drift / undefined names)
        run: python scripts/lint_consistency.py

      - name: Validate complete installation catalog and rejection cases
        run: |
          pip install -r scripts/requirements-manifest.txt
          python scripts/validate-installation-manifests.py
          python scripts/test-installation-manifests.py

      - name: Install backend deps
        run: |
          if [ -f "$EXT/backend/requirements.txt" ]; then
            pip install -r "$EXT/backend/requirements.txt"
          fi

      - name: Backend standalone tests (blocking)
        run: python scripts/run-backend-tests.py

  # NOTE: C# mod (BannerlordLink) is NOT built in CI — it needs the Bannerlord
  # game DLLs which aren't available on the runner. Build it locally via
  # scripts/deploy.ps1 -Mod. (Future: Bannerlord.ReferenceAssemblies NuGet.)

  manager-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Manager WPF app
        run: dotnet build ShedLink.Manager/src/ShedLink.Manager.App/ShedLink.Manager.App.csproj -c Release

      - name: Build offline release signer
        run: dotnet build ShedLink.Manager/tools/ShedLink.Manager.SignArtifact/ShedLink.Manager.SignArtifact.csproj -c Release

      - name: Build Manager lifecycle verifier
        run: dotnet build ShedLink.Manager/tools/ShedLink.Manager.VerifyLifecycle/ShedLink.Manager.VerifyLifecycle.csproj -c Release

      - name: Manager security, detection and restart self-test
        run: dotnet run --project ShedLink.Manager/tests/ShedLink.Manager.Core.SelfTest/ShedLink.Manager.Core.SelfTest.csproj -c Release

      - name: RimLink paused game synchronization regression
        run: dotnet run --project RimLink/tests/PausedSyncHarness -c Release

      - name: RimLink writes its own log even when the engine log is silenced
        run: dotnet run --project RimLink/tests/LogFileHarness -c Release

      - name: RimWorld frontend prices come from the server, not hardcoded
        run: node scripts/test-frontend-rimworld-prices.mjs

      - name: Action lock separates actions and never fails silently
        run: node scripts/test-frontend-action-lock.mjs

      - name: Panel login survives a synchronous onAuthorized (no TDZ)
        run: node scripts/test-frontend-auth-init.mjs

      - name: Viewer identity recovery refreshes state and permits login retry
        run: node scripts/test-viewer-auth-recovery.mjs
