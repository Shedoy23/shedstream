<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<title>Оверлей — раскладка питомцев</title>
<!-- Страница собрана ИЗ overlay.html: стили скопированы оттуда, раскладка
     берётся из того же pet-layout.js. Смысл в том, чтобы видеть ровно то, что
     уедет в прод. Прошлая версия этого файла имела свои стили и свою случайную
     раскладку — и показывала не то, что происходит на стриме. -->
<style>
body { margin:0; background:#101014; color:#efeff1; font:14px system-ui; }
.bar { padding:10px 14px; background:#18181b; display:flex; gap:14px; align-items:center; }
.bar input { width:70px; }
#stage { position:relative; height:70vh; border-bottom:1px solid #2d2d2f;
         background:linear-gradient(#1b1b21,#101014); overflow:hidden; }
#pets-strip { position:absolute; inset:0; }

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: transparent;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'JetBrains Mono', monospace;
    position: relative;
}

/* ══════════════════════════════════════════
   ОБЩИЕ СТИЛИ КАРТОЧЕК
══════════════════════════════════════════ */
.notification {
    position: absolute;
    bottom: 40px;
    right: 40px;
    width: 480px;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: flex-end;
}

.card {
    width: 100%;
    border-radius: 16px;
    padding: 20px 24px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(12px);
    transform: translateX(540px);
    opacity: 0;
    transition: none;
}

.card.show {
    animation: slideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

.card.hide {
    animation: slideOut 0.4s cubic-bezier(0.55, 0, 1, 0.45) forwards;
}

@keyframes slideIn {
    from { transform: translateX(540px); opacity: 0; }
    to   { transform: translateX(0);     opacity: 1; }
}

@keyframes slideOut {
    from { transform: translateX(0);     opacity: 1; }
    to   { transform: translateX(540px); opacity: 0; }
}

/* прогресс-бар внизу карточки — сколько осталось показывать */
.card-timer {
    position: absolute;
    bottom: 0; left: 0;
    height: 3px;
    width: 100%;
    transform-origin: left;
}

.card-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 600;
    margin-bottom: 6px;
    opacity: 0.7;
}

.card-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 18px;
    font-weight: 900;
    line-height: 1.2;
    margin-bottom: 4px;
}

.card-sub {
    font-size: 12px;
    opacity: 0.75;
    line-height: 1.5;
}

.card-icon {
    font-size: 36px;
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    filter: drop-shadow(0 0 12px currentColor);
    opacity: 0.9;
}

/* ДЖЕКПОТ CSS-блок целиком удалён 2026-05-10 (Phase 1.I lexicon scrub) */

/* ══════════════════════════════════════════
   ИВЕНТ — СТАРТ (фиолетовый)
══════════════════════════════════════════ */
.card-event-start {
    background: linear-gradient(135deg, rgba(8,5,20,0.93) 0%, rgba(20,8,45,0.93) 100%);
    border: 1px solid rgba(140, 80, 255, 0.5);
    box-shadow:
        0 0 0 1px rgba(140,80,255,0.1),
        0 8px 40px rgba(100,40,200,0.35),
        inset 0 1px 0 rgba(180,120,255,0.15);
}
.card-event-start .card-label { color: #b06aff; }
.card-event-start .card-title { color: #f0e8ff; }
.card-event-start .card-sub   { color: #c8a8ff; }
.card-event-start .card-timer { background: linear-gradient(90deg, #9747ff, #e040fb); }

/* анимированная рамка */
.card-event-start::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 17px;
    background: linear-gradient(90deg, #9747ff, #e040fb, #9747ff);
    background-size: 200%;
    animation: borderFlow 2s linear infinite;
    z-index: -1;
    opacity: 0.6;
}
@keyframes borderFlow {
    0%   { background-position: 0%; }
    100% { background-position: 200%; }
}

/* ══════════════════════════════════════════
   ИВЕНТ — ТАЙМЕР (идёт ивент)
══════════════════════════════════════════ */
.card-event-live {
    background: linear-gradient(135deg, rgba(5,15,20,0.93) 0%, rgba(5,25,35,0.93) 100%);
    border: 1px solid rgba(0,200,160,0.4);
    box-shadow:
        0 0 0 1px rgba(0,200,160,0.1),
        0 8px 40px rgba(0,160,130,0.25),
        inset 0 1px 0 rgba(0,255,200,0.1);
}
.card-event-live .card-label { color: #00e8b8; }
.card-event-live .card-title { color: #e0fff8; }
.card-event-live .card-sub   { color: #80f0d8; }
.card-event-live .card-timer { background: linear-gradient(90deg, #00e8b8, #00b8ff); }
.card-event-live .card-icon  { color: #00e8b8; }

/* пульс онлайн-точка */
.live-dot {
    display: inline-block;
    width: 8px; height: 8px;
    background: #00e8b8;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    box-shadow: 0 0 0 0 rgba(0,232,184,0.5);
    animation: livePulse 1.5s ease-out infinite;
}
@keyframes livePulse {
    0%   { box-shadow: 0 0 0 0   rgba(0,232,184,0.5); }
    70%  { box-shadow: 0 0 0 8px rgba(0,232,184,0); }
    100% { box-shadow: 0 0 0 0   rgba(0,232,184,0); }
}

/* вклады голосующих */
.bids-list {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.bid-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
}
.bid-bar-wrap {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
}
.bid-bar {
    height: 100%;
    background: linear-gradient(90deg, #00e8b8, #00b8ff);
    border-radius: 2px;
    transition: width 0.5s ease;
}
.bid-name { color: #e0fff8; min-width: 80px; }
.bid-amount { color: #80f0d8; min-width: 60px; text-align: right; }
.bid-chance { color: #00e8b8; min-width: 40px; text-align: right; }

/* ══════════════════════════════════════════
   ИВЕНТ — ФИНАЛ (победитель)
══════════════════════════════════════════ */
.card-event-end {
    background: linear-gradient(135deg, rgba(5,15,5,0.93) 0%, rgba(10,30,10,0.93) 100%);
    border: 1px solid rgba(50,200,100,0.45);
    box-shadow:
        0 0 0 1px rgba(50,200,100,0.1),
        0 8px 40px rgba(30,160,70,0.3),
        inset 0 1px 0 rgba(80,255,120,0.12);
}
.card-event-end .card-label { color: #50e880; }
.card-event-end .card-title { color: #e8ffe0; }
.card-event-end .card-sub   { color: #90e8a8; }
.card-event-end .card-timer { background: linear-gradient(90deg, #50e880, #00ff88); }

.winner-name {
    font-family: 'Unbounded', sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: #50e880;
    text-shadow: 0 0 20px rgba(80,232,128,0.5);
}
.prize-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(80,232,128,0.12);
    border: 1px solid rgba(80,232,128,0.3);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 12px;
    color: #50e880;
    margin-top: 6px;
}

/* конфетти на победу */
.confetti-wrap {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: 16px;
    pointer-events: none;
}
.confetti-piece {
    position: absolute;
    width: 6px;
    height: 10px;
    border-radius: 2px;
    top: -10px;
    animation: confettiFall var(--d, 1.2s) var(--delay, 0s) ease-in forwards;
    left: var(--x, 50%);
    background: var(--c, #50e880);
    transform: rotate(var(--r, 0deg));
}
@keyframes confettiFall {
    0%   { transform: rotate(var(--r)) translateY(0)   scaleX(1); opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: rotate(calc(var(--r) + 360deg)) translateY(120px) scaleX(0.5); opacity: 0; }
}

/* legacy CSS блок целиком удалён 2026-05-10 (Phase 1.I lexicon scrub) */

/* Стили панели ивента (#event-panel, .ep-*, #ep-announce) удалены
   2026-07-29 вместе с механикой «рулекциона» и её разметкой. */
/* ══════════════════════════════════════
   PETS-STRIP — активные зрители с питомцами
   (Phase 7, 2026-05-12; opt-out streamer'ом)
══════════════════════════════════════ */
/* Sprint 5.22 patch: pets гуляют по всей ширине overlay'а, а не сидят
   фиксированным строем в нижнем левом углу. Strip занимает всю ширину;
   каждая карточка — position:absolute со своим random walk-path. */
/* 2026-07-27 (просьба владельца): питомцы ходят по САМОМУ низу кадра.
   Было bottom:40px — они висели над нижней кромкой, будто в воздухе.
   Высота поднята со 120 до 168px: подпись переехала НАД питомца, и при 120px
   overflow:hidden срезал бы ей верх. */
#pets-strip {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 168px;
    /* Питомцы — фоновая жизнь кадра, они НИКОГДА не должны закрывать собой
       информацию. Раньше z-index не был задан ни им, ни карточкам событий:
       порядок решался тем, что позже добавилось в DOM, то есть случайностью.
       Панель бойцов (z-index:6) и так была выше, а вот карточка события —
       как повезёт. Теперь порядок задан явно. */
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    transition: opacity .4s ease;
}
#pets-strip.visible {
    opacity: 1;
}
/* 2026-07-27 (решение владельца): в бою низ кадра принадлежит бойцам.
   Карточки призванных живут по тому же низу (bottom:14px, z-index:6) и
   вставали поверх питомцев — перекрытие ~100px по всей ширине. Прячем
   питомцев на время боя, после боя они возвращаются сами (та же плавность
   .4s, что и при появлении).
   Селектор из ДВУХ классов специально: у `.visible` opacity:1, и правило с
   одним классом её бы не перебило. */
#pets-strip.visible.battle {
    opacity: 0;
}
/* Pet-card frameless (background/border/shadow убраны). Position:absolute
   с random --walk-start (left base). Анимация pet-walk oscillates
   translateX от 0 до --walk-amp + лёгкий bob по Y. */
.pet-card {
    position: absolute;
    /* Глубина (2026-08-23): ряд задаёт отступ снизу, масштаб и прозрачность.
       Дальние мельче, выше и бледнее — сцена читается как перспектива, а не
       как куча. Раньше все стояли в одной линии и налезали друг на друга. */
    bottom: var(--depth-bottom, 0px);
    opacity: 0;
    left: var(--walk-start, 0vw);
    min-width: 72px;
    text-align: center;
    opacity: 0;
    transition: opacity .35s ease;
    animation: pet-walk var(--walk-duration, 22s) ease-in-out
               var(--walk-delay, 0s) infinite;
    will-change: transform;
}
.pet-card.in {
    opacity: var(--depth-opacity, 1);
}
/* Масштаб живёт на внутреннем слое, а не на .pet-card: на карточке уже висит
   transform от прогулки, и второй transform его бы затёр. */
.pet-card .pet-card-visual {
    transform: scale(var(--depth-scale, 1));
    transform-origin: 50% 100%;
}
/* Sprint 5.28: walk cycle с idle phases. Pet большую часть времени стоит
   в south, иногда делает поход вправо (с east sprite) → idle на новом месте
   → возвращается влево (с west sprite). Direction sprites swapped через
   stacked img'и с opacity-keyframes (см. .pet-walk-frame). */
@keyframes pet-walk {
    /* 0-30%: idle at start. */
    0%, 30%    { transform: translateX(0)                                  translateY(0); }
    /* 30-50%: walking right с 5 bob-up'ами (каждые ~2.5% = ~1.5-3.5s). */
    32.5%      { transform: translateX(calc(var(--walk-amp, 30vw) * 0.125)) translateY(-5px); }
    35%        { transform: translateX(calc(var(--walk-amp, 30vw) * 0.250)) translateY(0); }
    37.5%      { transform: translateX(calc(var(--walk-amp, 30vw) * 0.375)) translateY(-5px); }
    40%        { transform: translateX(calc(var(--walk-amp, 30vw) * 0.500)) translateY(0); }
    42.5%      { transform: translateX(calc(var(--walk-amp, 30vw) * 0.625)) translateY(-5px); }
    45%        { transform: translateX(calc(var(--walk-amp, 30vw) * 0.750)) translateY(0); }
    47.5%      { transform: translateX(calc(var(--walk-amp, 30vw) * 0.875)) translateY(-5px); }
    50%        { transform: translateX(var(--walk-amp, 30vw))               translateY(0); }
    /* 50-80%: idle at right end. */
    80%        { transform: translateX(var(--walk-amp, 30vw))               translateY(0); }
    /* 80-100%: walking back left с 5 bob-up'ами. */
    82.5%      { transform: translateX(calc(var(--walk-amp, 30vw) * 0.875)) translateY(-5px); }
    85%        { transform: translateX(calc(var(--walk-amp, 30vw) * 0.750)) translateY(0); }
    87.5%      { transform: translateX(calc(var(--walk-amp, 30vw) * 0.625)) translateY(-5px); }
    90%        { transform: translateX(calc(var(--walk-amp, 30vw) * 0.500)) translateY(0); }
    92.5%      { transform: translateX(calc(var(--walk-amp, 30vw) * 0.375)) translateY(-5px); }
    95%        { transform: translateX(calc(var(--walk-amp, 30vw) * 0.250)) translateY(0); }
    97.5%      { transform: translateX(calc(var(--walk-amp, 30vw) * 0.125)) translateY(-5px); }
    100%       { transform: translateX(0)                                   translateY(0); }
}

/* Sprint 5.28: direction-aware sprite swap. Stacked east/west img'и поверх
   south creature. Opacity-keyframes синхронизированы с pet-walk через
   shared --walk-duration / --walk-delay. */
.pet-walk-frame {
    position: absolute;
    top: 0;
    left: 50%;
    width: var(--pet-stage-size, 128px);
    height: var(--pet-stage-size, 128px);
    transform: translateX(-50%);
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    -ms-interpolation-mode: nearest-neighbor;
    pointer-events: none;
    opacity: 0;
    z-index: 4;
    animation-duration: var(--walk-duration, 22s);
    animation-delay: var(--walk-delay, 0s);
    animation-iteration-count: infinite;
    animation-timing-function: linear;
}
.pet-walk-frame--east { animation-name: pet-walk-frame-east; }
.pet-walk-frame--west { animation-name: pet-walk-frame-west; }

/* East visible 30-50% cycle (walking right). Fast 0.1% switch для crisp swap. */
@keyframes pet-walk-frame-east {
    0%, 29.9%   { opacity: 0; }
    30%, 49.9%  { opacity: 1; }
    50%, 100%   { opacity: 0; }
}
/* West visible 80-100% cycle (walking back left). */
@keyframes pet-walk-frame-west {
    0%, 79.9%   { opacity: 0; }
    80%, 99.9%  { opacity: 1; }
    100%        { opacity: 0; }
}
/* Sway — качание creature'а в ритм шагов (на .pet-stage child).
   --pet-card-sway-delay JS-staggered чтобы каждый качался не синхронно.
   Sprint 5.28: south creature скрыт во время walking-фаз (30-50% и 80-100%)
   чтобы не накладываться на east/west overlay sprites. Два анимации —
   sway (transform) + visibility (opacity) одновременно. */
.pet-card .pet-stage {
    animation: pet-card-sway var(--pet-card-sway-dur, 2.8s) ease-in-out infinite,
               pet-walk-south-visibility var(--walk-duration, 22s) steps(1, end) infinite;
    animation-delay: var(--pet-card-sway-delay, 0s),
                     var(--walk-delay, 0s);
    transform-origin: 50% 90%;
}
@keyframes pet-walk-south-visibility {
    0%, 29.9%   { opacity: 1; }
    30%, 49.9%  { opacity: 0; }
    50%, 79.9%  { opacity: 1; }
    80%, 99.9%  { opacity: 0; }
    100%        { opacity: 1; }
}
@keyframes pet-card-sway {
    0%, 100% { transform: rotate(-5deg); }
    50%      { transform: rotate( 5deg); }
}
.pet-card-visual {
    line-height: 1.1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 4px;
    /* Sprint 5.28: anchor для absolute pet-walk-frame overlays (east/west sprites) */
    position: relative;
}
.pet-card-visual .pc-head, .pet-card-visual .pc-acc {
    font-size: 18px;
}
.pet-card-visual .pc-head { transform: translateY(-4px); }

/* ===== PET-STAGE (Sprint 5.21) — inline копия для standalone overlay.html =====
   Зеркало стилей из viewer.css. SVG creature + 6 anchored slots. */
.pet-stage {
    position: relative;
    width: var(--pet-stage-size, 128px);
    aspect-ratio: 1;
    margin: 0 auto;
    /* Sprint 5.22 patch: overlay = frameless (no border-radius/overflow/bg).
       В extension.html сохраняется border-radius внутри pets-modal через viewer.css. */
    overflow: visible;
    --pet-body-light:  #d8b4fe;
    --pet-body-mid:    #a855f7;
    --pet-body-dark:   #6b21a8;
    --pet-body-stroke: #4c1d95;
}
/* Body palette presets (зеркало viewer.css) */
.pet-stage--bg_violet {
    --pet-body-light: #f3e8ff; --pet-body-mid: #c084fc;
    --pet-body-dark:  #7e22ce; --pet-body-stroke: #581c87;
    --pet-stage-bg-glow: rgba(192,132,252,.22);
}
.pet-stage--bg_rainbow {
    --pet-body-light: #fef3c7; --pet-body-mid: #f472b6;
    --pet-body-dark:  #8b5cf6; --pet-body-stroke: #be185d;
    --pet-stage-bg-glow: rgba(244,114,182,.24);
}
.pet-stage--bg_stars {
    --pet-body-light: #93c5fd; --pet-body-mid: #3b82f6;
    --pet-body-dark:  #1e3a8a; --pet-body-stroke: #1e40af;
    --pet-stage-bg-glow: rgba(59,130,246,.22);
}
/* Sprint 5.22 patch: aura particles (overlay inline copy) */
.pet-stage__aura { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.pet-stage__aura-particle {
    position: absolute;
    font-size: calc(var(--pet-stage-size, 128px) * 0.18);
    line-height: 1;
    transform: translate(-50%, -50%) scale(0.7);
    animation: pet-stage-aura-particle 1.8s ease-in-out infinite;
    filter: drop-shadow(0 0 3px rgba(255,255,255,0.45));
}
@keyframes pet-stage-aura-particle {
    0%, 100% { opacity: 0.45; transform: translate(-50%, -50%) scale(0.85); }
    50%      { opacity: 1.00; transform: translate(-50%, -50%) scale(1.15); }
}
.pet-stage__aura-particle--n0 { top:  -2%; left: 50%; animation-delay: 0s;    }
.pet-stage__aura-particle--n1 { top:  22%; left: 95%; animation-delay: 0.30s; }
.pet-stage__aura-particle--n2 { top:  72%; left: 95%; animation-delay: 0.60s; }
.pet-stage__aura-particle--n3 { top: 100%; left: 50%; animation-delay: 0.90s; }
.pet-stage__aura-particle--n4 { top:  72%; left:  5%; animation-delay: 1.20s; }
.pet-stage__aura-particle--n5 { top:  22%; left:  5%; animation-delay: 1.50s; }
.pet-stage__base {
    position: absolute; inset: 0; z-index: 3;
    width: 100%; height: 100%;
    pointer-events: none;
    animation: pet-stage-breathe 4s ease-in-out infinite;
}
/* Sprint 5.28 (2026-05-24): PNG pixel-art creature вместо SVG blob.
   image-rendering: pixelated сохраняет chunky pixels при upscale. */
.pet-stage__creature {
    width: 100%; height: 100%; display: block;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    -ms-interpolation-mode: nearest-neighbor;
}
@keyframes pet-stage-breathe {
    0%, 100% { transform: translateY(0)    scale(1); }
    50%      { transform: translateY(-1px) scale(1.015); }
}
.pet-stage__egg {
    position: absolute; inset: 0; z-index: 3;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--pet-stage-size, 128px) * 0.55);
    line-height: 1;
    animation: pet-stage-wobble 3.2s ease-in-out infinite;
    pointer-events: none;
}
@keyframes pet-stage-wobble {
    0%, 100% { transform: rotate(-3deg); }
    50%      { transform: rotate( 3deg); }
}
.pet-stage__slot {
    /* Sprint 5.28: slot = FULL OVERLAY. Item sprite внутри 104×104 viewBox
       сам себя anchor'ит — slot CSS даёт только z-stack. */
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}
.pet-stage__slot svg,
.pet-stage__slot .pet-stage__item-img {
    width: 100%; height: 100%; display: block;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    -ms-interpolation-mode: nearest-neighbor;
}
.pet-stage__slot--body      { z-index: 5; }
.pet-stage__slot--face      { z-index: 6; }
.pet-stage__slot--accessory { z-index: 6; }
.pet-stage__slot--head      { z-index: 7; }
/* 2026-07-27: подпись переехала ПОД питомца → НАД питомцем (просьба владельца).
   margin-top:4px заменён на margin-bottom:2px — иначе подпись прилипала к
   голове. Порядок в разметке тоже изменён: сначала подпись, потом визуал. */
.pet-card-name {
    font-size: 11px;
    font-weight: 600;
    color: #efeff1;
    margin-bottom: 2px;
    /* --name-lift ставится из JS: соседние питомцы получают разную высоту
       подписи, чтобы тексты не наложились при встрече (см. раскладку ниже). */
    transform: translateY(calc(-1 * var(--name-lift, 0px)));
    white-space: nowrap;
    font-family: 'Unbounded', sans-serif;
    /* Sprint 5.22 patch: без рамки текст должен читаться на любом фоне
       стрима — text-shadow обводка по контуру. Длинные ники не режутся. */
    text-shadow: 0 1px 3px rgba(0,0,0,0.85), 0 0 6px rgba(0,0,0,0.6);
}
/* Уровень зрителя — тот же, что расширение показывает ему самому («LVL 38»).
   Отдельный цвет, чтобы ник читался как ник, а не как часть числа. */
.pet-card-lvl {
    color: #a970ff;
    font-weight: 700;
    margin-right: 5px;
}
.pet-card-user {
    font-size: 9px;
    color: #cccce0;
    letter-spacing: 0.5px;
    margin-top: 2px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.85), 0 0 4px rgba(0,0,0,0.6);
}

/* ══════ Sprint 5.4: Bannerlord summoned heroes panel (BLT-style) ══════ */
#bnr-summoned-panel {
    position: fixed;
    left: 14px;
    bottom: 14px;
    right: 14px;
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 6px;
    z-index: 6;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
    max-height: 35vh;
    overflow: hidden;
}
#bnr-summoned-panel.visible { opacity: 1; }

/* ── Карточка героя (HP bar = фон, заливается слева направо) ── */
.bnr-hero-card {
    position: relative;
    min-width: 110px;
    max-width: 170px;
    flex: 0 1 auto;
    padding: 6px 10px;
    border-radius: 6px;
    overflow: hidden;
    color: #fff;
    font-family: 'Unbounded', sans-serif;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(2px);
}

/* Side coloring — background + HP fill colors */
.bnr-hero-card.side-player { background: #202050; }
.bnr-hero-card.side-enemy  { background: #401122; }

/* HP bar — absolute fill behind content */
.bnr-hp-fill {
    position: absolute;
    inset: 0;
    z-index: 0;
    transition: width 0.4s ease;
    opacity: 0.85;
}
.bnr-hero-card.side-player .bnr-hp-fill { background: #6666CC; }
.bnr-hero-card.side-enemy  .bnr-hp-fill { background: #AA3277; }

/* State filters (по BLT) */
.bnr-hero-card.state-routed .bnr-hero-name {
    filter:
        drop-shadow(0 0 1px black)
        drop-shadow(0 0 2px black)
        drop-shadow(0 0 5px #fbbf24)
        drop-shadow(0 0 3px #fbbf24);
}
.bnr-hero-card.state-unconscious .bnr-hero-name {
    filter:
        drop-shadow(0 0 1px black)
        drop-shadow(0 0 2px black)
        drop-shadow(0 0 5px #fb923c)
        drop-shadow(0 0 3px #fb923c);
}
.bnr-hero-card.state-killed .bnr-hero-name {
    filter:
        drop-shadow(0 0 1px black)
        drop-shadow(0 0 2px black)
        drop-shadow(0 0 5px #ef4444)
        drop-shadow(0 0 3px #ef4444);
}
.bnr-hero-card.state-killed,
.bnr-hero-card.state-unconscious {
    opacity: 0.75;
}

.bnr-hero-card > * { position: relative; z-index: 1; }

.bnr-hero-name {
    font-size: 12px;
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
    margin-bottom: 3px;
    letter-spacing: 0.2px;
}

.bnr-hero-stats {
    display: flex;
    gap: 6px;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
}
.bnr-hero-stats .stat-kills { color: #ffffff; font-weight: 700; }
.bnr-hero-stats .stat-gold  { color: #fbbf24; margin-left: auto; }
.bnr-hero-stats .stat-xp    { color: #FF7FB0; }


</style></head>
<body>
<div class="bar">
  <label>зрителей: <input id="n" type="number" value="13" min="1" max="30"></label>
  <button id="go">Разложить</button>
  <span id="verdict"></span>
</div>
<div id="stage"><div id="pets-strip" class="visible"></div></div>

<script src="pet-stage.js"></script>
<script src="pet-layout.js"></script>
<script>
function render(n) {
  const strip = document.getElementById('pets-strip');
  const names = Array.from({length:n}, (_,i)=>`viewer_${i+1}`);
  strip.innerHTML = names.map(u => `
    <div class="pet-card in">
      <div class="pet-card-visual">${PetStage.renderHtml({pet_type:'creature',name:null},
          {body:{item_id: Math.random()<0.5?'skin_kimono':'skin_underwear'}}, {size:96})}</div>
      <div class="pet-card-name">[${10+Math.floor(Math.random()*40)}lvl] ${u}</div>
    </div>`).join('');
  const cards = strip.querySelectorAll('.pet-card');
  const layout = PetLayout.layoutPets(cards.length);
  cards.forEach((card, i) => {
    const L = layout[i];
    card.style.setProperty('--walk-start',    `${L.startVw.toFixed(2)}vw`);
    card.style.setProperty('--walk-amp',      `${(L.dir*L.ampVw).toFixed(2)}vw`);
    card.style.setProperty('--walk-duration', `${L.durationS}s`);
    card.style.setProperty('--walk-delay',    `${L.delayS}s`);
    card.style.setProperty('--pet-card-sway-delay', `${L.swayDelayS}s`);
    card.style.setProperty('--pet-card-sway-dur', `${(2.4+(i%5)*0.22).toFixed(2)}s`);
    card.style.setProperty('--name-lift',     `${L.nameLiftPx}px`);
    card.style.setProperty('--depth-bottom',  `${L.bottomPx}px`);
    card.style.setProperty('--depth-scale',   L.scale);
    card.style.setProperty('--depth-opacity', L.opacity);
    card.style.zIndex = String(10 - L.row);
  });
  // Тот же критерий, что в автотесте — чтобы глаз и арифметика не расходились.
  const byRow = {};
  layout.forEach(L => (byRow[L.row] = byRow[L.row]||[]).push(PetLayout.occupiedSpan(L)));
  let worst = 0;
  Object.values(byRow).forEach(spans => {
    spans.sort((a,b)=>a.from-b.from);
    for (let i=1;i<spans.length;i++) worst = Math.min(worst, spans[i].from - spans[i-1].to);
  });
  const rows = new Set(layout.map(L=>L.row)).size;
  document.getElementById('verdict').textContent =
    `рядов: ${rows} · худший зазор в ряду: ${worst.toFixed(2)}vw ` +
    (worst >= -0.01 ? '— наложений нет' : '— ЕСТЬ НАЛОЖЕНИЕ');
}
document.getElementById('go').addEventListener('click', () => render(+document.getElementById('n').value||13));
render(13);
</script>
</body></html>
