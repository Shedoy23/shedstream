server {
    listen 80;
    listen 443 ssl;
    server_name shedoy23.ru www.shedoy23.ru;

    # RimWorld catalogs can exceed nginx's default request body limit.
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/shedoy23.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shedoy23.ru/privkey.pem;

    # Immutable, signed Manager integration releases. HTTP is deliberately not
    # redirected: Manager starts with HTTPS and rejects every redirect.
    location ^~ /releases/ {
        if ($scheme != https) { return 404; }
        alias /srv/shedlink/releases/;
        autoindex off;
        limit_except GET HEAD { deny all; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /frontend/ {
        proxy_pass http://127.0.0.1:8000/frontend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
