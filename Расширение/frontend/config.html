<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- ОБЯЗАТЕЛЬНАЯ БИБЛИОТЕКА TWITCH -->
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <title>Extension Config</title>
    <style>
        body {
            background: #0e0e10;
            color: #efeff1;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h2 {
            color: #9147ff;
            margin-bottom: 20px;
        }
        p {
            color: #adadb8;
            line-height: 1.5;
        }
        .info-box {
            background: #1f1f23;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2d2d2f;
            margin-top: 20px;
        }
        .link {
            color: #9147ff;
            text-decoration: none;
        }
        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚙️ Настройки расширения</h2>
        
        <div class="info-box">
            <p>Расширение работает в штатном режиме.</p>
            <p>Для управления используйте админ-панель:</p>
            <p><a href="https://shedoy23.ru/admin" target="_blank" class="link">https://shedoy23.ru/admin</a></p>
        </div>

        <div class="info-box">
            <p>📊 Статистика канала будет доступна в ближайшее время.</p>
        </div>
    </div>
</body>
</html>
